<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <script>
    async function loadReports() {
    if (!apiReady()) return;
    const reports = await window.pywebview.api.list_reports();
    window._reportsCache = reports;
    applyFilters();
  }

  function applyFilters() {
    const all = window._reportsCache || [];
    const q = (document.getElementById('filter-search').value || '').trim().toLowerCase();
    const refFilter = (document.getElementById('filter-reference').value || '').trim();
    const numFilter = (document.getElementById('filter-number').value || '').trim();

    const filtered = all.filter(r => {
      if (refFilter && (r.reference || '') !== refFilter) return false;
      if (numFilter && (r.number || '') !== numFilter) return false;
      if (q) {
        const haystack = [r.source_name, r.reference, r.number].filter(Boolean).join(' ').toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });

    renderReports(filtered, all.length);
  }

  function clearFilters() {
    document.getElementById('filter-search').value = '';
    document.getElementById('filter-reference').value = '';
    document.getElementById('filter-number').value = '';
    applyFilters();
  }

  function renderReports(reports, totalCount) {
    const listEl = document.getElementById('reports-list');
    const countEl = document.getElementById('reports-count');

    const isFiltered = totalCount !== undefined && totalCount !== reports.length;
    countEl.textContent = isFiltered
      ? `${reports.length} of ${totalCount} report${totalCount === 1 ? '' : 's'}`
      : `${reports.length} report${reports.length === 1 ? '' : 's'}`;

    if (!reports.length) {
      listEl.innerHTML = `<div class="report-empty">${totalCount ? 'No reports match those filters.' : 'No reports yet — run an extraction to see it here.'}</div>`;
      return;
    }

    listEl.innerHTML = reports.map(r => `
      <div class="report-row">
        <div class="report-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6"/></svg>
        </div>
        <div class="report-meta">
          <b>${r.source_name}</b>
          <span>${r.timestamp} · ch ${r.channels.join(',')}</span>
        </div>
        ${r.reference ? `<span class="report-ref">VT${r.reference}_${r.number}</span>` : ''}
        <button class="report-open" onclick='openReportByPath(${JSON.stringify(r.output_path)})'>Open</button>
      </div>
    `).join('');
  }

  function openReportByPath(path) {
    window.pywebview.api.open_report(path);
  }

  async function revealFolder() {
    if (!apiReady()) return;
    await window.pywebview.api.reveal_reports_folder();
  }

 </script>   
</body>
</html>
